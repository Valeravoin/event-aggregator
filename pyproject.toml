[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "TRY"]
ignore = [
    "E501",   # длинные строки не блокируем
    "B008",   # Depends() в аргументах — стандарт FastAPI
    "BLE001", # осознанная ловля Exception (планировщик, провайдер)
    "TRY002", # raise Exception в тестах — осознанный мок
    "TRY003", # длинные сообщения в исключениях — у нас это осознанный стиль
    "TRY300", # return в try — читаемость важнее канона
    "TRY400", # logger.error вместо logger.exception — не критично
    "B904",   # raise ... from e — улучшение трейсбеков, не блокер
    "E402",   # импорты не в начале файла: нужно conftest.py и alembic/env.py
]

[tool.ruff.lint.isort]
known-first-party = [
    "models", "database", "main", "schemas", "repositories",
    "services", "http_client", "scheduler", "settings", "sync_runner",
]
